name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: petrotwin
          POSTGRES_PASSWORD: petrotwin
          POSTGRES_DB: petrotwin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U petrotwin -d petrotwin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Ruff lint
        run: poetry run ruff check .

      - name: Black format check
        run: poetry run black --check .

      - name: Run database migrations & seed test data
        env:
          DATABASE_URL: postgresql+asyncpg://petrotwin:petrotwin@localhost:5432/petrotwin
        run: |
          poetry run alembic upgrade head
          poetry run python scripts/seed_synthetic_wells.py --if-empty
          poetry run python scripts/seed_users.py

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql+asyncpg://petrotwin:petrotwin@localhost:5432/petrotwin
          REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest -v

  frontend:
    name: Frontend — Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint .

      - name: Run Component Tests
        run: npx vitest run

      - name: Build Next.js
        run: npm run build

  docker-build:
    name: Docker Images Build Verification
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t petrotwin-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: docker build -t petrotwin-frontend:ci ./frontend
